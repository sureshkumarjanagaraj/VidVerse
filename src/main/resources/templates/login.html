<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VidVerse - Login</title>

    <link rel="stylesheet"
          href="/login.css?v=2">

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navbar">

        <div class="logo">
            VidVerse
        </div>

        <div class="nav-links">

            <button onclick="window.location.href='/'">
                Home
            </button>

            <button onclick="window.location.href='/register'">
                Register
            </button>

        </div>

    </nav>



    <!-- =========================
         LOGIN PAGE
    ========================= -->

    <main class="login-page">


        <div class="login-card">


            <div class="login-header">

                <span class="login-tag">
                    VIDVERSE PREMIUM
                </span>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to continue watching your
                    favorite premium video songs.
                </p>

            </div>



            <!-- LOGIN FORM -->

            <form action="/login"
                  method="post"
                  class="login-form">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>



                <!-- LOGIN BUTTON -->

                <button type="submit"
                        class="login-submit">

                    Login

                </button>


            </form>



            <!-- FORGOT PASSWORD -->

            <div class="forgot-password">

                <button onclick="window.location.href='/forgotPassword'">
                    Forgot Password?
                </button>

            </div>



            <!-- REGISTER LINK -->

            <div class="register-link">

                <p>
                    Don't have an account?

                    <a href="/register">
                        Create an Account
                    </a>
                </p>

            </div>


        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="footer-logo">
            VidVerse
        </div>

        <p>
            © 2026 Sureshkumar Janagaraj.
            All Rights Reserved.
        </p>

        <p class="footer-tagline">
            Secure &nbsp; • &nbsp;
            Premium &nbsp; • &nbsp;
            Entertainment
        </p>

    </footer>


</body>

</html>
