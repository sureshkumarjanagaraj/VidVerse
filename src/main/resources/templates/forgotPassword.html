<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VidVerse - Forgot Password</title>

    <link rel="stylesheet"
          href="/forgotPassword.css?v=1">

</head>

<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navbar">

        <div class="logo">
            VidVerse
        </div>

        <div class="nav-links">

            <button onclick="window.location.href='/'">
                Home
            </button>

            <button onclick="window.location.href='/about'">
                About
            </button>

            <button onclick="window.location.href='/login'">
                Login
            </button>

            <button class="register-btn"
                    onclick="window.location.href='/register'">
                Register
            </button>

        </div>

    </nav>


    <!-- =========================
         FORGOT PASSWORD
    ========================= -->

    <main class="forgot-section">

        <div class="forgot-card">

            <div class="lock-icon">
                ?
            </div>

            <span class="page-label">
                ACCOUNT RECOVERY
            </span>

            <h1>
                Forgot Password?
            </h1>

            <p class="description">
                Enter your registered email address and
                we will send an OTP to help you reset
                your VidVerse password.
            </p>


            <form action="/forgotPassword"
                  method="post">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required>

                </div>


                <button type="submit"
                        class="submit-btn">

                    Send OTP

                </button>

            </form>


            <div class="back-login">

                <a href="/login">
                    ← Back to Login
                </a>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="footer-logo">
            VidVerse
        </div>

        <p>
            © 2026 Sureshkumar Janagaraj.
            All Rights Reserved.
        </p>

        <p class="footer-tagline">
            Secure &nbsp; • &nbsp;
            Premium &nbsp; • &nbsp;
            Entertainment
        </p>

    </footer>


</body>

</html>
