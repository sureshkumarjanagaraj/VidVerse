<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VidVerse - Register</title>

    <link rel="stylesheet"
          href="/register.css?v=2">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            VidVerse
        </div>

        <div class="nav-links">

            <button onclick="window.location.href='/'">
                Home
            </button>

            <button onclick="window.location.href='/login'">
                Login
            </button>

        </div>

    </nav>


    <main class="register-page">


        <div class="register-card">


            <div class="register-header">

                <span class="register-tag">
                    VIDVERSE PREMIUM
                </span>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Register now and enjoy premium video songs
                    with your VidVerse subscription.
                </p>

            </div>



            <!-- REGISTER FORM -->

            <form action="/register" method="post" class="register-form">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="userName"> Username </label> <input type="text"  id="userName" name="userName" placeholder="Enter your username" required>

                </div>

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>

                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>

                </div>

                <!-- REGISTER BUTTON -->

                <button type="submit"
                        class="register-submit">

                    Create Account

                </button>


            </form>
            <!-- LOGIN LINK -->

            <div class="login-link">

                <p>
                    Already have an account?

                    <a href="/login">
                        Login here
                    </a>
                </p>

            </div>


        </div>

    </main>

    <footer>

        <div class="footer-logo">
            VidVerse
        </div>

        <p>
            © 2026 Sureshkumar Janagaraj.
            All Rights Reserved.
        </p>

        <p class="footer-tagline">
            Secure &nbsp; • &nbsp;
            Premium &nbsp; • &nbsp;
            Entertainment
        </p>

    </footer>


</body>

</html>
