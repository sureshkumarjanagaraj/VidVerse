<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VidVerse - Login Error</title>

    <link rel="stylesheet"
          href="/loginFail.css?v=1">

</head>

<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navbar">

        <div class="logo">
            VidVerse
        </div>

        <div class="nav-links">

            <button onclick="window.location.href='/'">
                Home
            </button>

            <button onclick="window.location.href='/about'">
                About
            </button>

            <button onclick="window.location.href='/login'">
                Login
            </button>

            <button class="register-btn"
                    onclick="window.location.href='/register'">
                Register
            </button>

        </div>

    </nav>


    <!-- =========================
         ERROR SECTION
    ========================= -->

    <main class="error-section">

        <div class="error-card">

            <div class="error-icon">
                !
            </div>

            <span class="error-label">
                LOGIN FAILED
            </span>

            <h1>
                Login Unsuccessful
            </h1>

            <p>
                The email or password you entered is incorrect.
                Please check your details and try again.
            </p>


            <div class="error-buttons">

                <a href="/login"
                   class="primary-btn">

                    Try Login Again

                </a>


                <a href="/forgotPassword"
                   class="secondary-btn">

                    Forgot Password?

                </a>

            </div>


            <div class="home-link">

                <a href="/">
                    ← Back to Home
                </a>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="footer-logo">
            VidVerse
        </div>

        <p>
            © 2026 Sureshkumar Janagaraj.
            All Rights Reserved.
        </p>

        <p class="footer-tagline">
            Secure &nbsp; • &nbsp;
            Premium &nbsp; • &nbsp;
            Entertainment
        </p>

    </footer>


</body>

</html>
