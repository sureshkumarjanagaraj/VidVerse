<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VidVerse - New Password</title>

    <link rel="stylesheet"
          href="/new-password.css">

</head>

<body>

    <div class="password-container">

        <div class="logo">
            Vid<span>Verse</span>
        </div>

        <h1>Set New Password</h1>

        <p class="success-message">
            OTP verified successfully.
        </p>

        <p class="description">
            Create a new password for your VidVerse account.
        </p>


        <form action="/newPassword" method="post">

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your new password"
                required
                minlength="6">


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your new password"
                required
                minlength="6">


            <button type="submit">
                Update Password
            </button>

        </form>


        <a href="/login" class="back-login">
            Back to Login
        </a>

    </div>


    <footer>

        <div class="footer-logo">
            VidVerse
        </div>

        <p>
            © 2026 Sureshkumar Janagaraj.
            All Rights Reserved.
        </p>

        <p class="footer-tagline">
            Secure &nbsp; • &nbsp;
            Premium &nbsp; • &nbsp;
            Entertainment
        </p>

    </footer>

</body>

</html>
